<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="符符">
    <title>上課啦！極限趕功課 - 嚴格精準版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            width: 100%;
            max-width: 440px;
            height: 740px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        /* 老師視角區 */
        #teacher-zone {
            height: 38%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.4));
            border-bottom: 2px dashed rgba(239, 68, 68, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        #teacher-avatar {
            font-size: 68px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        #teacher-status {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 30px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
        }
        .alert-bg { 
            background: linear-gradient(to bottom, rgba(127, 29, 29, 0.85), rgba(185, 28, 28, 0.5)) !important; 
            border-bottom-color: #f87171 !important;
        }

        /* 學生作業區 */
        #student-zone {
            height: 62%;
            background: rgba(248, 250, 252, 0.95);
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 14px 20px;
            position: relative;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
        }
        .combo-badge {
            background: #e0e7ff;
            color: #4338ca;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        /* 進度條與體力條 */
        .progress-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
        }
        #progress-container, #energy-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            border-radius: 10px;
            transition: width 0.1s ease;
        }
        #energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            transition: width 0.1s ease;
        }

        /* 圓形點擊按鈕 */
        .action-btn-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px 0;
        }
        #action-btn {
            width: 135px;
            height: 135px;
            font-size: 16px;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #action-btn span:first-child {
            font-size: 28px;
        }
        #action-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            background: linear-gradient(135deg, #d97706, #b45309);
        }
        #action-btn:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 作者署名 */
        .game-footer {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* 遮罩畫面 (開始/結束) */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 24px;
        }
        .screen-overlay h1 { color: #f8fafc; margin-bottom: 12px; font-size: 24px; font-weight: 800; }
        .screen-overlay p { color: #94a3b8; margin-bottom: 24px; font-size: 14px; line-height: 1.6; }
        .btn-start {
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            transition: transform 0.1s;
        }
        .btn-start:active { transform: scale(0.96); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 開始畫面 -->
        <div id="start-screen" class="screen-overlay">
            <h1>🔥 上課啦！嚴格精準特訓版</h1>
            <p><strong>遊戲規則：</strong><br>1. 老師轉頭動作放慢，提供更清楚的判斷時間。<br>2. <strong>零延遲判定：</strong>只要老師進入「死死盯著你」的紅光狀態，瞬間點擊就會被立刻抓包扣心！<br>3. 注意手痠體力值，適時休息！</p>
            <button class="btn-start" onclick="startGame()">開始挑戰</button>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="game-over-screen" class="screen-overlay hidden">
            <h1 id="game-over-title">遊戲結束</h1>
            <p id="game-over-desc">表現評語...</p>
            <button class="btn-start" onclick="startGame()">再挑戰一次</button>
        </div>

        <!-- 老師視角區 -->
        <div id="teacher-zone">
            <div id="teacher-avatar">👨‍🏫</div>
            <div id="teacher-status">老師正在寫黑板...</div>
        </div>

        <!-- 學生作業區 -->
        <div id="student-zone">
            <div class="stats">
                <span id="lives-display">❤️ 3 / 3</span>
                <span id="combo-display" class="combo-badge">Combo: 0</span>
                <span id="time-display">⏱️ 25s</span>
            </div>
            
            <div class="progress-wrapper">
                <div class="progress-label">
                    <span>作業進度</span>
                    <span id="progress-text">0%</span>
                </div>
                <div id="progress-container">
                    <div id="progress-bar"></div>
                </div>

                <div class="progress-label" style="margin-top: 2px;">
                    <span>手痠體力值</span>
                    <span id="energy-text">100%</span>
                </div>
                <div id="energy-container">
                    <div id="energy-bar"></div>
                </div>
            </div>

            <div class="action-btn-container">
                <button id="action-btn" onclick="doHomework()">
                    <span>✍️</span>
                    <span>狂寫作業</span>
                </button>
            </div>

            <div class="game-footer">🎮 遊戲製作：符符</div>
        </div>
    </div>

    <script>
        let gameState = {
            lives: 3,
            timeLeft: 25,
            progress: 0,
            energy: 100,
            combo: 0,
            isTeacherWatching: false,
            isExhausted: false,
            isPlaying: false,
            timer: null,
            teacherTimer: null
        };

        const teacherZone = document.getElementById('teacher-zone');
        const teacherAvatar = document.getElementById('teacher-avatar');
        const teacherStatus = document.getElementById('teacher-status');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');
        const livesDisplay = document.getElementById('lives-display');
        const comboDisplay = document.getElementById('combo-display');
        const timeDisplay = document.getElementById('time-display');
        const actionBtn = document.getElementById('action-btn');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverDesc = document.getElementById('game-over-desc');

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            gameState.lives = 3;
            gameState.timeLeft = 25;
            gameState.progress = 0;
            gameState.energy = 100;
            gameState.combo = 0;
            gameState.isPlaying = true;
            gameState.isTeacherWatching = false;
            gameState.isExhausted = false;

            updateUI();

            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                if (!gameState.isPlaying) return;
                gameState.timeLeft--;
                
                if (gameState.energy < 100 && !gameState.isExhausted) {
                    gameState.energy = Math.min(100, gameState.energy + 4);
                }

                if (gameState.progress >= 100) {
                    endGame(true);
                } else if (gameState.timeLeft <= 0) {
                    endGame(false);
                }
                updateUI();
            }, 1000);

            scheduleTeacherTurn();
        }

        function scheduleTeacherTurn() {
            if (!gameState.isPlaying) return;

            let waitRange = Math.max(1000, 2600 - (gameState.progress * 15));
            let waitTime = Math.random() * 1500 + waitRange;
            
            gameState.teacherTimer = setTimeout(() => {
                if (!gameState.isPlaying) return;

                // 稍微放慢預警階段的節奏 (從 500ms 延長至 800ms)
                teacherAvatar.innerText = "👀";
                teacherStatus.innerText = "⚠️ 老師頭好像在晃...";

                setTimeout(() => {
                    if (!gameState.isPlaying) return;
                    
                    let isFakeOut = Math.random() < 0.28; // 28% 機率是假動作

                    if (isFakeOut) {
                        // 假動作：放慢速度讓玩家看清楚是虛驚一場
                        teacherZone.style.background = "linear-gradient(to bottom, rgba(127, 29, 29, 0.5), rgba(30, 41, 59, 0.4))";
                        teacherAvatar.innerText = "🤨";
                        teacherStatus.innerText = "❓ 假動作！虛驚一場...";
                        
                        setTimeout(() => {
                            if (!gameState.isPlaying) return;
                            teacherZone.style.background = "";
                            teacherAvatar.innerText = "👨‍🏫";
                            teacherStatus.innerText = "✍️ 趕快把握機會狂抄！";
                            scheduleTeacherTurn();
                        }, 900); // 假動作停留時間稍微拉長一點點，比較好辨別
                    } else {
                        // 真實盯哨：一瞬間立刻生效，零延遲判定！
                        gameState.isTeacherWatching = true;
                        teacherZone.classList.add('alert-bg');
                        teacherAvatar.innerText = "😡";
                        teacherStatus.innerText = "🛑 抓包！死死盯著你！";

                        let watchDuration = Math.random() * 800 + 1200;
                        setTimeout(() => {
                            if (!gameState.isPlaying) return;
                            gameState.isTeacherWatching = false;
                            teacherZone.classList.remove('alert-bg');
                            teacherAvatar.innerText = "👨‍🏫";
                            teacherStatus.innerText = "✍️ 老師轉回去了，快抄！";

                            scheduleTeacherTurn();
                        }, watchDuration);
                    }

                }, 800); // 預警時間拉長，放慢節奏

            }, waitTime);
        }

        function doHomework() {
            if (!gameState.isPlaying || gameState.isExhausted) return;

            // 消耗體力
            gameState.energy -= 6;
            if (gameState.energy <= 0) {
                gameState.energy = 0;
                gameState.isExhausted = true;
                actionBtn.disabled = true;
                actionBtn.innerText = "手痠休息中...";
                setTimeout(() => {
                    if (!gameState.isPlaying) return;
                    gameState.isExhausted = false;
                    actionBtn.disabled = false;
                    actionBtn.innerHTML = "<span>✍️</span><span>狂寫作業</span>";
                }, 1200);
            }

            // 零延遲判定：只要 isTeacherWatching 是 true，點擊瞬間直接抓包扣心！
            if (gameState.isTeacherWatching) {
                gameState.lives--;
                gameState.combo = 0;
                triggerFlash();
                teacherStatus.innerText = "💥 被抓包！扣一顆心！";
                if (gameState.lives <= 0) {
                    endGame(false);
                }
            } else {
                gameState.combo++;
                let gain = 3 + Math.floor(gameState.combo / 5);
                gameState.progress += gain;
                if (gameState.progress > 100) gameState.progress = 100;
            }
            updateUI();
        }

        function triggerFlash() {
            let container = document.getElementById('game-container');
            container.style.borderColor = '#ef4444';
            setTimeout(() => {
                container.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            }, 200);
        }

        function updateUI() {
            progressBar.style.width = gameState.progress + '%';
            progressText.innerText = gameState.progress + '%';
            energyBar.style.width = gameState.energy + '%';
            energyText.innerText = gameState.energy + '%';
            livesDisplay.innerText = `❤️ ${gameState.lives} / 3`;
            comboDisplay.innerText = `Combo: ${gameState.combo}`;
            timeDisplay.innerText = `⏱️ ${gameState.timeLeft}s`;
        }

        function endGame(isWin) {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            clearTimeout(gameState.teacherTimer);

            gameOverScreen.classList.remove('hidden');
            if (isWin) {
                gameOverTitle.innerText = "🏆 完美神速通關！";
                gameOverDesc.innerText = `太強了！在零延遲嚴格盯哨與假動作干擾下順利交卷，符符頒發你「頂級抄霸」稱號！`;
            } else {
                gameOverTitle.innerText = "💥 挑戰失敗！";
                gameOverDesc.innerText = gameState.lives <= 0 ? "被老師抓個正著！零延遲瞬間沒收作業，回家吃竹筍炒肉絲！" : "時間到啦！作業沒寫完，準備去罰站囉！";
            }
        }
    </script>
</body>
</html>
