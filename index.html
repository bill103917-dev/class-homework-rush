<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="符符">
    <title>上課啦！極限趕功課</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            width: 100%;
            max-width: 440px;
            height: 720px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        /* 老師視角區 */
        #teacher-zone {
            height: 40%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.4));
            border-bottom: 2px dashed rgba(239, 68, 68, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        #teacher-avatar {
            font-size: 72px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        #teacher-status {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
        }
        .alert-bg { 
            background: linear-gradient(to bottom, rgba(127, 29, 29, 0.85), rgba(185, 28, 28, 0.5)) !important; 
            border-bottom-color: #f87171 !important;
        }

        /* 學生作業區 */
        #student-zone {
            height: 60%;
            background: rgba(248, 250, 252, 0.95);
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px 16px 20px;
            position: relative;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
        }
        
        /* 進度條 */
        .progress-wrapper {
            width: 100%;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 6px;
        }
        #progress-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 12px;
            height: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            border-radius: 12px;
            transition: width 0.1s ease;
        }

        /* 現代圓形點擊按鈕 */
        .action-btn-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        #action-btn {
            width: 150px;
            height: 150px;
            font-size: 17px;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #action-btn span:first-child {
            font-size: 32px;
        }
        #action-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3), inset 0 2px 2px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        /* 作者署名 */
        .game-footer {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* 遮罩畫面 (開始/結束) */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 24px;
        }
        .screen-overlay h1 { color: #f8fafc; margin-bottom: 12px; font-size: 24px; font-weight: 800; }
        .screen-overlay p { color: #94a3b8; margin-bottom: 24px; font-size: 14px; line-height: 1.6; }
        .btn-start {
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-start:active {
            transform: scale(0.96);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 開始畫面 -->
        <div id="start-screen" class="screen-overlay">
            <h1>📝 上課啦！極限趕功課</h1>
            <p>老師隨時會轉頭盯哨！<br>趁老師背對時瘋狂點擊圓形按鈕寫作業，<br>但老師轉頭時絕對不能動，否則會被抓包扣血！<br>在時間內把作業進度衝到 100% 吧！</p>
            <button class="btn-start" onclick="startGame()">挑戰開始</button>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="game-over-screen" class="screen-overlay hidden">
            <h1 id="game-over-title">遊戲結束</h1>
            <p id="game-over-desc">表現評語...</p>
            <button class="btn-start" onclick="startGame()">再挑戰一次</button>
        </div>

        <!-- 老師視角區 -->
        <div id="teacher-zone">
            <div id="teacher-avatar">👨‍🏫</div>
            <div id="teacher-status">老師正在寫黑板...</div>
        </div>

        <!-- 學生作業區 -->
        <div id="student-zone">
            <div class="stats">
                <span id="lives-display">❤️ 3 / 3</span>
                <span id="time-display">⏱️ 30s</span>
            </div>
            
            <div class="progress-wrapper">
                <div class="progress-label">
                    <span>作業進度</span>
                    <span id="progress-text">0%</span>
                </div>
                <div id="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>

            <div class="action-btn-container">
                <button id="action-btn" onclick="doHomework()">
                    <span>✍️</span>
                    <span>狂寫作業</span>
                </button>
            </div>

            <div class="game-footer">🎮 遊戲製作：符符</div>
        </div>
    </div>

    <script>
        let gameState = {
            score: 0,
            lives: 3,
            timeLeft: 30,
            progress: 0,
            isTeacherWatching: false,
            isPlaying: false,
            timer: null,
            teacherTimer: null
        };

        const teacherZone = document.getElementById('teacher-zone');
        const teacherAvatar = document.getElementById('teacher-avatar');
        const teacherStatus = document.getElementById('teacher-status');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const livesDisplay = document.getElementById('lives-display');
        const timeDisplay = document.getElementById('time-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverDesc = document.getElementById('game-over-desc');

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            gameState.lives = 3;
            gameState.timeLeft = 30;
            gameState.progress = 0;
            gameState.isPlaying = true;
            gameState.isTeacherWatching = false;

            updateUI();

            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                if (!gameState.isPlaying) return;
                gameState.timeLeft--;
                timeDisplay.innerText = `⏱️ ${gameState.timeLeft}s`;

                if (gameState.progress >= 100) {
                    endGame(true);
                } else if (gameState.timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);

            scheduleTeacherTurn();
        }

        function scheduleTeacherTurn() {
            if (!gameState.isPlaying) return;

            let waitTime = Math.random() * 2000 + 2000;
            
            gameState.teacherTimer = setTimeout(() => {
                if (!gameState.isPlaying) return;

                teacherAvatar.innerText = "👀";
                teacherStatus.innerText = "⚠️ 老師好像在轉頭了...";

                setTimeout(() => {
                    if (!gameState.isPlaying) return;
                    gameState.isTeacherWatching = true;
                    teacherZone.classList.add('alert-bg');
                    teacherAvatar.innerText = "😡";
                    teacherStatus.innerText = "🛑 抓包！老師正在盯著你！";

                    let watchDuration = Math.random() * 1000 + 1500;
                    setTimeout(() => {
                        if (!gameState.isPlaying) return;
                        gameState.isTeacherWatching = false;
                        teacherZone.classList.remove('alert-bg');
                        teacherAvatar.innerText = "👨‍🏫";
                        teacherStatus.innerText = "✍️ 老師背對了，快抄！";

                        scheduleTeacherTurn();
                    }, watchDuration);

                }, 600);

            }, waitTime);
        }

        function doHomework() {
            if (!gameState.isPlaying) return;

            if (gameState.isTeacherWatching) {
                gameState.lives--;
                triggerFlash();
                teacherStatus.innerText = "💥 被抓包！扣一顆紅心！";
                if (gameState.lives <= 0) {
                    endGame(false);
                }
            } else {
                gameState.progress += 4;
                if (gameState.progress > 100) gameState.progress = 100;
            }
            updateUI();
        }

        function triggerFlash() {
            let container = document.getElementById('game-container');
            container.style.borderColor = '#ef4444';
            setTimeout(() => {
                container.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            }, 200);
        }

        function updateUI() {
            progressBar.style.width = gameState.progress + '%';
            progressText.innerText = gameState.progress + '%';
            livesDisplay.innerText = `❤️ ${gameState.lives} / 3`;
            timeDisplay.innerText = `⏱️ ${gameState.timeLeft}s`;
        }

        function endGame(isWin) {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            clearTimeout(gameState.teacherTimer);

            gameOverScreen.classList.remove('hidden');
            if (isWin) {
                gameOverTitle.innerText = "🎉 挑戰成功！完美趕完！";
                gameOverDesc.innerText = `太神啦！你成功在鐘聲響起前把作業歐趴交出去，免去了一頓排頭！`;
            } else {
                gameOverTitle.innerText = "💥 慘遭當場沒收！";
                gameOverDesc.innerText = gameState.lives <= 0 ? "因為太白目在老師盯哨時動手，作業直接被當場沒收！" : "時間到啦！作業沒寫完，準備去導師室報到囉！";
            }
        }
    </script>
</body>
</html>
